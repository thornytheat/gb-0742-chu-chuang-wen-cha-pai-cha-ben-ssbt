<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ stages[stage][0] }} · 橱窗温差排查本</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/layout.css">
  <link rel="stylesheet" href="/static/specimen.css">
  <script type="module" src="/static/main.js"></script>
</head>
<body data-stage="{{ stage }}">
  <aside class="rail">
    <a class="brand" href="/" data-section><span class="brand-plan" aria-hidden="true"><i></i><i></i></span><span>橱窗温差<br>排查本</span></a>
    <nav aria-label="排查目录">
      {% for key, (title, path) in stages.items() %}
      <a href="{{ path }}" data-section {% if key == stage %}aria-current="page"{% endif %}>{{ title }}</a>
      {% endfor %}
    </nav>
    <div class="rail-foot"><a href="/docs">接口文档</a><span id="policy">—</span></div>
  </aside>
  <div class="desk">
    <header class="toolbar">
      <div class="heading">
        <p id="shift-caption">值班记录</p>
        <h1>{{ stages[stage][0] }}</h1>
      </div>
      <div class="controls">
        <label>样例 <select id="sample" disabled aria-label="样例"></select></label>
        <button id="run" class="button fill" type="button" disabled>运行排查</button>
        <button id="rerun" class="button" type="button" disabled>重跑</button>
        <a id="export" class="button" hidden>导出证据</a>
        <button id="print" class="button print-button" type="button" disabled>打印</button>
      </div>
    </header>
    <main>
      <section class="sheet-meta" aria-label="值班范围">
        <label>展柜 <select id="cabinet" aria-label="展柜" disabled></select></label>
        <span id="shift-window">—</span>
        <time id="generated">—</time>
      </section>
      <dl class="kpis">
        <div class="kpi"><dt>应监测</dt><dd id="expected">—</dd></div>
        <div class="kpi stable"><dt>稳定</dt><dd id="stable">—</dd></div>
        <div class="kpi abnormal"><dt>异常</dt><dd id="abnormal">—</dd></div>
        <div class="kpi missing"><dt>缺证</dt><dd id="missing">—</dd></div>
        <div class="kpi"><dt>隔离行</dt><dd id="isolated">—</dd></div>
        <div class="kpi"><dt>配准容差</dt><dd id="tolerance">—</dd></div>
      </dl>
      <div id="feedback" class="feedback" role="status" hidden></div>
      <div id="stage-content" aria-busy="true" hidden>{% include stage ~ '.html' %}</div>
    </main>
    <footer class="statusbar"><span id="statusbar">正在核取归卷</span><span>馆内时间 UTC+08</span></footer>
  </div>
</body>
</html>
